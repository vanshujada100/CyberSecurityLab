<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}SecureVote{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <a class="brand" href="/" aria-label="SecureVote home">
                <span class="brand-mark" aria-hidden="true">SV</span>
                <span class="brand-copy">SecureVote<small>College election lab</small></span>
            </a>
            <a class="header-link" href="/login">Sign in</a>
        </div>
    </header>
    <main class="page-shell">
        {% if request.state.integrity_status == "COMPROMISED" %}
            <div class="integrity-banner" role="alert"><strong>Integrity compromised</strong><span>Do not trust election records until they have been investigated.</span></div>
        {% endif %}
        <!-- Jinja2 autoescapes values by default; avoid |safe to reduce XSS risk. -->
        <section class="content-panel">{% block content %}{% endblock %}</section>
    </main>
    <footer class="site-footer">SecureVote | College election security lab</footer>
</body>
</html>
